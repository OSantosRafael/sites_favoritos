<!DOCTYPE html>
<!-- Declaração do tipo de documento HTML5 -->
<html lang="pt-br">
<!-- Abertura da tag HTML com idioma definido como português do Brasil -->

<head>
    <!-- Cabeçalho da página (metadados) -->
    <meta charset="UTF-8">
    <!-- Define a codificação de caracteres como UTF-8 -->
    <title>Meus sites favoritos</title>
    <!-- Título exibido na aba do navegador -->
</head>

<body>
    <!-- Corpo da página (conteúdo visível) -->

    <h1>Meus sites favoritos: Rafael</h1>
    <!-- Título principal da página com o nome do aluno -->

    <hr>
    <!-- Linha horizontal para separação visual -->

    <!-- Site 1: YouTube -->
    <h1>YouTube</h1>
    <!-- Nome do site acima da imagem -->
    <img src="imagens/youtube.png" width="600" alt="Captura de tela do YouTube">
    <!-- Imagem do site com largura de 600 pixels -->
    <br>
    <!-- Quebra de linha -->
    <a href="https://www.youtube.com/" target="_blank">https://www.youtube.com/</a>
    <!-- Link para o site, abrindo em nova aba -->

    <hr>
    <!-- Linha horizontal para separação entre os sites -->

    <!-- Site 2: Netflix -->
    <h1>Netflix</h1>
    <!-- Nome do site acima da imagem -->
    <img src="imagens/netflix.png" width="600" alt="Captura de tela do Netflix">
    <!-- Imagem do site com largura de 600 pixels -->
    <br>
    <!-- Quebra de linha -->
    <a href="https://www.netflix.com/browse" target="_blank">https://www.netflix.com/browse</a>
    <!-- Link para o site, abrindo em nova aba -->

    <hr>
    <!-- Linha horizontal para separação entre os sites -->

    <!-- Site 3: Kick -->
    <h1>Kick</h1>
    <!-- Nome do site acima da imagem -->
    <img src="imagens/kick.png" width="600" alt="Captura de tela do Kick">
    <!-- Imagem do site com largura de 600 pixels -->
    <br>
    <!-- Quebra de linha -->
    <a href="https://kick.com/" target="_blank">https://kick.com/</a>
    <!-- Link para o site, abrindo em nova aba -->

    <hr>
    <!-- Linha horizontal para separação entre os sites -->

    <!-- Site 4: ESPN Brasil -->
    <h1>ESPN Brasil</h1>
    <!-- Nome do site acima da imagem -->
    <img src="imagens/espn.png" width="600" alt="Captura de tela do ESPN Brasil">
    <!-- Imagem do site com largura de 600 pixels -->
    <br>
    <!-- Quebra de linha -->
    <a href="https://www.espn.com.br/" target="_blank">https://www.espn.com.br/</a>
    <!-- Link para o site, abrindo em nova aba -->

    <hr>
    <!-- Linha horizontal para separação entre os sites -->

    <!-- Site 5: Curso em Vídeo -->
    <h1>Curso em Vídeo</h1>
    <!-- Nome do site acima da imagem -->
    <img src="imagens/cursoemvideo.png" width="600" alt="Captura de tela do Curso em Vídeo">
    <!-- Imagem do site com largura de 600 pixels -->
    <br>
    <!-- Quebra de linha -->
    <a href="https://www.cursoemvideo.com/" target="_blank">https://www.cursoemvideo.com/</a>
    <!-- Link para o site, abrindo em nova aba -->

    <hr>
    <!-- Linha horizontal final -->

</body>
<!-- Fechamento do corpo da página -->

</html>
<!-- Fechamento da tag HTML -->
